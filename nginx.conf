# =============================================================================
# nginx.conf — Non-root, hardened configuration for Angular SPA
#
# Key changes vs. the default nginx config:
#   • pid / temp paths moved to /tmp so nginx runs without root privileges
#   • server_tokens off  → hides nginx version from error responses
#   • Security headers added to every response
#   • Correct Cache-Control strategy: immutable for hashed assets, no-store for
#     index.html and env.js so fresh deployments are always picked up
#   • Gzip enabled with a safe type list
#   • Angular HTML5 routing: unknown paths fall back to index.html
# =============================================================================

# Must be writable by the nginx user; /tmp is always world-writable
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Temp paths (non-root can write to /tmp) ───────────────────────────────
    client_body_temp_path /tmp/client_body;
    proxy_temp_path        /tmp/proxy_temp;
    fastcgi_temp_path      /tmp/fastcgi_temp;
    uwsgi_temp_path        /tmp/uwsgi_temp;
    scgi_temp_path         /tmp/scgi_temp;

    # ── Logging (the official nginx image symlinks these to Docker stdio) ─────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile          on;
    tcp_nopush        on;
    keepalive_timeout 65;
    server_tokens     off;   # Never expose nginx version in headers / errors

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    server {
        listen      8080;   # Non-privileged port — no root required
        server_name _;
        root        /usr/share/nginx/html;
        index       index.html;

        # ── Security headers ──────────────────────────────────────────────────
        add_header X-Frame-Options         "SAMEORIGIN"                       always;
        add_header X-Content-Type-Options  "nosniff"                          always;
        add_header X-XSS-Protection        "1; mode=block"                    always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin"  always;
        add_header Permissions-Policy      "geolocation=(), microphone=(), camera=()" always;

        # ── Angular SPA routing ───────────────────────────────────────────────
        # Unknown paths serve index.html so the Angular router takes over
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── Immutable cache for hashed static assets ──────────────────────────
        # Angular appends a content hash to every JS/CSS filename in production,
        # so we can safely cache them forever (1 year).
        location ~* \.(js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|ico|svg)$ {
            expires    1y;
            add_header Cache-Control "public, immutable";
        }

        # ── No-cache for entry point and runtime config ────────────────────────
        # index.html and env.js must never be cached: a new deploy must be
        # picked up immediately on the next page load.
        location ~* ^/(index\.html|env\.js)$ {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
            expires    0;
        }
    }
}
