<!doctype html>
<!--
  class="dark" activa el modo oscuro de Tailwind CSS v4 de forma global.
  ThemeService sincroniza esta clase vía effect(). El valor inicial aquí
  evita el "flash of light mode" (FOLM) antes de que Angular arranque.
-->
<html lang="es" class="dark">
<head>
  <meta charset="utf-8">
  <title>AlgoFinance — Visualizador de Algoritmos UQ</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Panel interactivo de comparativa de algoritmos de ordenamiento sobre datos financieros históricos — Universidad del Quindío.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Inter: fuente principal del sistema de diseño financiero -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet"
  >
</head>
<body class="antialiased">
  <app-root></app-root>
</body>
</html>
