<!--
  Shell principal de la aplicación.
  Estructura: Navbar fija + <main> con el router-outlet.

  El fondo y color de texto base responden al tema (light/dark) gracias a las
  clases de Tailwind en el div raíz. ThemeService añade/quita class="dark" en
  <html>, lo que activa las variantes dark: de forma global.
-->
<div class="min-h-screen bg-gray-50 dark:bg-slate-950 text-gray-900 dark:text-gray-100 font-sans transition-colors duration-300">

  <!--
    Degradado ambiental radial (sólo visible en dark mode).
    Simula un "glow" proveniente del borde superior — estilo Bloomberg/Vercel.
  -->
  <div
    class="pointer-events-none fixed inset-0 z-0
           dark:[background:radial-gradient(ellipse_80%_40%_at_50%_-5%,rgba(16,185,129,0.07),transparent)]"
    aria-hidden="true"
  ></div>

  <!-- ════════════════════════ NAVBAR FIJA ════════════════════════ -->
  <header
    class="fixed inset-x-0 top-0 z-50 h-16
           bg-white/85 dark:bg-slate-950/85
           backdrop-blur-xl
           border-b border-gray-200/60 dark:border-white/[0.06]
           shadow-[0_1px_0_0_rgba(0,0,0,0.04)] dark:shadow-none
           transition-colors duration-300"
  >
    <div class="max-w-screen-2xl mx-auto h-full px-4 sm:px-6 flex items-center justify-between gap-4">

      <!-- ── Izquierda: Logo + Título ── -->
      <div class="flex items-center gap-3 min-w-0 flex-shrink-0">
        <!-- Ícono con glow esmeralda sutil -->
        <div
          class="flex h-9 w-9 flex-shrink-0 items-center justify-center rounded-xl
                 bg-brand-500/10 dark:bg-brand-400/[0.08]
                 ring-1 ring-brand-500/25 dark:ring-brand-400/20
                 dark:shadow-[0_0_14px_rgba(16,185,129,0.18)]"
        >
          <svg
            class="h-5 w-5 text-brand-600 dark:text-brand-400"
            fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round" stroke-linejoin="round"
              d="M2.25 18L9 11.25l4.306 4.307a11.95 11.95 0 015.814-5.519l2.74-1.22m0 0l-5.94-2.28m5.94 2.28l-2.28 5.941"
            />
          </svg>
        </div>

        <div class="min-w-0">
          <p class="text-[13px] font-bold leading-tight text-gray-900 dark:text-white truncate">
            AlgoFinance
            <span class="text-brand-600 dark:text-brand-400">· UQ</span>
          </p>
          <p class="hidden sm:block text-[11px] leading-tight text-gray-400 dark:text-gray-500 truncate">
            Análisis de Algoritmos Financieros — Fase 2
          </p>
        </div>
      </div>

      <!-- ── Centro: Badges de autores (md+) ── -->
      <div class="hidden md:flex items-center gap-2 flex-1 justify-center">
        @for (author of authors; track author) {
          <span
            class="inline-flex items-center gap-1.5 rounded-full pl-2 pr-3 py-1
                   bg-gray-100 dark:bg-white/[0.04]
                   ring-1 ring-gray-200/80 dark:ring-white/[0.07]
                   text-xs font-medium text-gray-600 dark:text-gray-400"
          >
            <span class="h-1.5 w-1.5 flex-shrink-0 rounded-full bg-brand-500"></span>
            {{ author }}
          </span>
        }
      </div>

      <!-- ── Derecha: Etiqueta de modo + Toggle ── -->
      <div class="flex items-center gap-3 flex-shrink-0">
        <span class="hidden sm:block text-xs font-medium text-gray-400 dark:text-gray-500 select-none w-8 text-right">
          {{ theme.isDark() ? 'Dark' : 'Light' }}
        </span>

        <!--
          Toggle Dark/Light.
          El thumb se desplaza con [style.left] reactivo al signal isDark().
          El fondo cambia con clases dark: de Tailwind.
        -->
        <button
          (click)="theme.toggle()"
          role="switch"
          [attr.aria-checked]="theme.isDark()"
          [attr.aria-label]="theme.isDark() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
          class="relative flex h-7 w-14 cursor-pointer items-center rounded-full
                 bg-slate-200 dark:bg-slate-700/80
                 ring-1 ring-slate-300/80 dark:ring-white/10
                 transition-all duration-300
                 hover:ring-brand-500/50
                 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2
                 focus:ring-offset-white dark:focus:ring-offset-slate-950"
        >
          <!-- Ícono sol (izquierda) -->
          <span class="absolute left-1.5 flex items-center pointer-events-none">
            <svg
              class="h-3.5 w-3.5 transition-opacity duration-300"
              [class.opacity-80]="!theme.isDark()" [class.opacity-20]="theme.isDark()"
              fill="currentColor" viewBox="0 0 20 20" aria-hidden="true"
              style="color: #f59e0b"
            >
              <path d="M10 2a.75.75 0 01.75.75v1.5a.75.75 0 01-1.5 0v-1.5A.75.75 0 0110 2zM10 15a.75.75 0 01.75.75v1.5a.75.75 0 01-1.5 0v-1.5A.75.75 0 0110 15zM10 7a3 3 0 100 6 3 3 0 000-6zM15.657 5.404a.75.75 0 10-1.06-1.06l-1.061 1.06a.75.75 0 001.06 1.06l1.061-1.06zM6.464 14.596a.75.75 0 10-1.06-1.06l-1.061 1.06a.75.75 0 001.06 1.061l1.061-1.061zM18 10a.75.75 0 01-.75.75h-1.5a.75.75 0 010-1.5h1.5A.75.75 0 0118 10zM5 10a.75.75 0 01-.75.75h-1.5a.75.75 0 010-1.5h1.5A.75.75 0 015 10zM14.596 15.657a.75.75 0 001.06-1.06l-1.06-1.061a.75.75 0 10-1.06 1.06l1.06 1.061zM5.404 6.464a.75.75 0 001.06-1.06L5.404 4.343a.75.75 0 00-1.06 1.06l1.06 1.061z"/>
            </svg>
          </span>

          <!-- Ícono luna (derecha) -->
          <span class="absolute right-1.5 flex items-center pointer-events-none">
            <svg
              class="h-3.5 w-3.5 transition-opacity duration-300"
              [class.opacity-80]="theme.isDark()" [class.opacity-20]="!theme.isDark()"
              fill="currentColor" viewBox="0 0 20 20" aria-hidden="true"
              style="color: #93c5fd"
            >
              <path fill-rule="evenodd" d="M7.455 2.004a.75.75 0 01.26.77 7 7 0 009.958 7.967.75.75 0 011.067.853A8.5 8.5 0 116.647 1.921a.75.75 0 01.808.083z" clip-rule="evenodd"/>
            </svg>
          </span>

          <!-- Thumb deslizante -->
          <span
            class="absolute top-1 h-5 w-5 rounded-full
                   bg-white dark:bg-slate-200
                   shadow-md shadow-black/20
                   transition-all duration-300 ease-in-out"
            [style.left]="theme.isDark() ? '29px' : '4px'"
          ></span>
        </button>
      </div>

    </div>
  </header>
  <!-- ════════════════════════ FIN NAVBAR ════════════════════════ -->

  <!-- Contenido principal: padding-top para compensar el navbar fijo -->
  <main class="relative z-10 pt-16">
    <router-outlet />
  </main>

</div>
