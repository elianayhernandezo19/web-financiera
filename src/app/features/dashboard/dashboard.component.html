<div class="dashboard-cmd">
  <div class="cmd-container">

    <!-- 1. HEADER: Controles Pista de Carreras -->
    <header class="cmd-header glass-panel">
      <div class="cmd-header__brand">
        <svg class="cmd-header__logo" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
        <h1 class="cmd-header__title">Terminal <span>Alfa</span></h1>
      </div>

      <div class="cmd-header__actions">
        <!-- Selector mockeado para cumplir el UI requirement -->
        <div class="cmd-select-wrap">
          <select class="cmd-select" disabled>
            <option>All Historical Data (63k+)</option>
          </select>
          <svg class="cmd-select-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
          </svg>
        </div>

        <button class="cmd-btn-primary" (click)="onSimulateRace()" [disabled]="isRacing()">
          @if (isRacing()) {
            <span class="cmd-pulse"></span>
            Simulando Carrera…
          } @else {
            ▶ Ejecutar Carrera de Algoritmos
          }
        </button>
      </div>
    </header>

    <!-- 2. PISTA DE CARRERAS (Horizontal Chart) -->
    <section class="cmd-race-track glass-panel">
      <h2 class="cmd-section-title">Carrera de Algoritmos (Benchmark)</h2>
      <div class="cmd-chart-wrapper">
        <app-sort-chart [entries]="racingExecutionTimes()" />
      </div>
    </section>

    <!-- 3. PANEL INFERIOR (Grid 2 columnas) -->
    <div class="cmd-bottom-panels">
      
      <!-- Izquierda: Top 15 Volumen -->
      <section class="cmd-panel-left glass-panel">
        <h2 class="cmd-section-title">Top 15 Volumen</h2>
        <app-top-volume [data]="topVolumeData()" />
      </section>

      <!-- Derecha: Data Grid -->
      <section class="cmd-panel-right glass-panel" [class.is-fullscreen]="isFullscreen()">
        <header class="cmd-panel-header">
          <h2 class="cmd-section-title">Data Grid Histórico</h2>
          <button class="btn-fullscreen" (click)="toggleFullscreen()" aria-label="Pantalla completa">
            @if (isFullscreen()) {
              <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 9L4 4m0 0v4m0-4h4m6 5l5-5m0 0v4m0-4h-4M9 15l-5 5m0 0v-4m0 4h4m6-5l5 5m0 0v-4m0 4h-4"/>
              </svg>
            } @else {
              <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/>
              </svg>
            }
          </button>
        </header>

        <div class="cmd-table-wrapper">
          <app-results-table [data]="sortedData()" />
        </div>
      </section>

    </div>

  </div>
</div>
