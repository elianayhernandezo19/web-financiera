<div class="chart-container">
  @if (entries().length === 0) {
    <!-- Estado vacío -->
    <div class="chart-container__empty">
      <svg class="chart-container__empty-icon" fill="none" stroke="currentColor" stroke-width="1.2" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M3 13.5V19a1 1 0 001 1h4v-6H3zm7-4.5V19a1 1 0 001 1h4V9h-4zm7 3V19a1 1 0 001 1h4v-7h-4z"/>
      </svg>
      <p class="chart-container__empty-title">Ejecuta un algoritmo para ver la comparativa</p>
      <p class="chart-container__empty-sub">El historial de tiempos aparecerá aquí</p>
    </div>
  } @else {
    <canvas
      baseChart
      [data]="chartData()"
      [options]="chartOptions()"
      type="bar"
    ></canvas>
  }
</div>
