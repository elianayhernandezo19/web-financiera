<div class="control-panel">

  <!-- ── Selector de Activo ── -->
  <div class="control-panel__group">
    <label for="assetSelect" class="control-panel__label">
      Activo Financiero
    </label>
    <div class="control-panel__select-wrap">
      <select
        id="assetSelect"
        class="control-panel__select"
        [value]="selectedAssetId()"
        (change)="emitSelectValue($event, assetSelected)"
      >
        @for (asset of assets(); track asset.id) {
          <option [value]="asset.id">
            {{ asset.ticker }} — {{ asset.name }}
          </option>
        }
      </select>
      <span class="control-panel__chevron">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
        </svg>
      </span>
    </div>
  </div>

  <!-- ── Selector de Algoritmo ── -->
  <div class="control-panel__group">
    <label for="algorithmSelect" class="control-panel__label">
      Algoritmo de Ordenamiento
    </label>
    <div class="control-panel__select-wrap">
      <select
        id="algorithmSelect"
        class="control-panel__select"
        [value]="selectedAlgorithmId()"
        (change)="emitSelectValue($event, algorithmSelected)"
      >
        @for (algo of algorithms(); track algo.id) {
          <option [value]="algo.id">{{ algo.name }}</option>
        }
      </select>
      <span class="control-panel__chevron">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
        </svg>
      </span>
    </div>
  </div>

  <!-- Divisor -->
  <div class="control-panel__divider"></div>

  <!-- Botón de ejecución -->
  <button
    class="control-panel__btn"
    (click)="onExecute()"
    [disabled]="isLoading()"
    [class.animate-glow-pulse]="isLoading()"
  >
    @if (isLoading()) {
      <svg class="btn__icon animate-spin" fill="none" viewBox="0 0 24 24" aria-hidden="true">
        <circle style="opacity: 0.25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
        <path style="opacity: 0.75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
      </svg>
      Ejecutando…
    } @else {
      <svg class="btn__icon btn__icon--play" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M11.596 8.697l-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393z"/>
      </svg>
      Ejecutar Ordenamiento
    }
  </button>

</div>
