name: Build & Load Docker Image to VPS

on:
  push:
    branches: [ "main", "quality" ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
      - '.env.example'

env:
  IMAGE_NAME: ${{ vars.IMAGE_NAME }}
  ACTIONS_RUNNER_DEBUG: true
  ACTIONS_STEP_DEBUG: true

jobs:
  build_and_load:
    runs-on: ubuntu-latest
    environment: AFVA VPS

    steps:

      # ── 1. Checkout ─────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Tag por rama ─────────────────────────────────────────
      - name: Decide tag based on branch
        id: tagger
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          echo "🔎 Branch detectada: $BRANCH"

          if [ "$BRANCH" = "main" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          elif [ "$BRANCH" = "quality" ]; then
            echo "tag=quality" >> $GITHUB_OUTPUT
          else
            echo "❌ Unsupported branch: $BRANCH"
            exit 1
          fi

      # ── 3. Build Docker ─────────────────────────────────────────
      - name: Build Docker image
        run: |
          echo "🐳 Construyendo imagen..."
          docker build -t "${IMAGE_NAME}:${{ steps.tagger.outputs.tag }}" .

      # ── 4. Guardar como TAR ─────────────────────────────────────
      - name: Save Docker image to tar
        run: |
          mkdir -p dist

          TAR_FILE="dist/${IMAGE_NAME}_${{ steps.tagger.outputs.tag }}.tar"

          echo "📦 Guardando imagen en $TAR_FILE"
          docker save "${IMAGE_NAME}:${{ steps.tagger.outputs.tag }}" -o "$TAR_FILE"

          chmod 644 "$TAR_FILE"

          echo "📁 Archivos en dist:"
          ls -lah dist

          echo "📏 Tamaño del archivo:"
          du -h "$TAR_FILE"

      # ── 5. Diagnóstico de red (falla rápido si no hay conectividad) ──
      - name: Debug network connectivity
        timeout-minutes: 1
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔎 Host  : ${{ vars.VPS_HOST }}"
          echo "🔎 Puerto: ${{ vars.VPS_PORT }}"
          echo "🔎 User  : ${{ vars.VPS_USER }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          echo "📡 Probando conectividad TCP..."
          if timeout 5 bash -c "echo > /dev/tcp/${{ vars.VPS_HOST }}/${{ vars.VPS_PORT }}"; then
            echo "✅ TCP OK — el puerto responde"
          else
            echo "❌ FALLO TCP — no se puede alcanzar ${{ vars.VPS_HOST }}:${{ vars.VPS_PORT }}"
            echo ""
            echo "Posibles causas:"
            echo "  • El VPS está apagado o reiniciando"
            echo "  • El firewall bloquea el puerto ${{ vars.VPS_PORT }}"
            echo "  • El host/puerto en las variables del repositorio es incorrecto"
            exit 1
          fi

      # ── 6. Test conexión SSH ────────────────────────────────────
      - name: Test SSH connection
        timeout-minutes: 1
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          port: ${{ vars.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15s
          request_pty: false
          script: |
            echo "✅ SSH OK"
            echo "Hostname : $(hostname)"
            echo "Usuario  : $(whoami)"
            echo "PWD      : $(pwd)"

      # ── 7. Subir TAR ────────────────────────────────────────────
      - name: Upload image tar to VPS (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          port: ${{ vars.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist/${{ env.IMAGE_NAME }}_${{ steps.tagger.outputs.tag }}.tar"
          target: "/tmp"

      # ── 8. Verificar archivo en VPS ─────────────────────────────
      - name: Verify file on VPS
        timeout-minutes: 1
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          port: ${{ vars.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10s
          request_pty: false
          script: |
            echo "📁 Archivos en /tmp:"
            ls -lah /tmp

      # ── 9. Cargar imagen en Docker VPS ──────────────────────────
      - name: Load image into Docker on VPS
        timeout-minutes: 5
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          port: ${{ vars.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 4m
          request_pty: false
          envs: IMAGE_NAME
          script: |
            set -e

            TAG="${{ steps.tagger.outputs.tag }}"
            TAR="/tmp/dist/${IMAGE_NAME}_${TAG}.tar"

            echo "🔍 Buscando archivo: $TAR"

            if [ ! -f "$TAR" ]; then
              echo "❌ ERROR: Tar no encontrado"
              echo "📁 Contenido actual de /tmp:"
              ls -lah /tmp
              exit 1
            fi

            echo "📏 Tamaño del archivo:"
            du -h "$TAR"

            echo "📦 Cargando imagen en Docker..."
            docker load -i "$TAR"

            echo "🧹 Eliminando archivo..."
            rm -f "$TAR"

            echo "✅ Imágenes disponibles:"
            docker images | grep "${IMAGE_NAME}" | head -n 5
